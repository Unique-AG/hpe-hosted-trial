---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: postgres-secret
  namespace: unique
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_USER: 
    USERDB_USER: 
    ADMIN_POSTGRES_PASSWORD: 
    USER_POSTGRES_PASSWORD: 
  template:
    metadata:
      creationTimestamp: null
      name: postgres-secret
      namespace: unique
    type: kubernetes.io/basic-auth
    data:
      username: '{{ index . "USERDB_USER" }}'
      password: '{{ index . "USER_POSTGRES_PASSWORD" }}'
