---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: rabbitmq-password-secret
  namespace: unique
spec:
  encryptedData:
    rabbitmq-user: 
    rabbitmq-erlang-cookie: 
    rabbitmq-password: 
  template:
    metadata:
      creationTimestamp: null
      name: rabbitmq-password-secret
      namespace: unique
    type: Opaque
    data:
      username: '{{ index . "rabbitmq-user" }}'
      password: '{{ index . "rabbitmq-password" }}'
      ".erlang.cookie": '{{ index . "rabbitmq-erlang-cookie" }}'
      default_user.conf: |
        default_user = {{ index . "rabbitmq-user" }}
        default_pass = {{ index . "rabbitmq-password" }}
