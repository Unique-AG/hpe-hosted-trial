apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: rabbitmq-virtual-service
spec:
  gateways:
    - istio-system/ezaf-gateway
  hosts:
    - rabbitmq.localhost
  http:
    - match:
        - uri:
            prefix: /
      rewrite:
        uri: /
      route:
        - destination:
            host: rabbitmq.unique.svc.cluster.local
            port:
              number: 15672
