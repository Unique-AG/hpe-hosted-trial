apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: redis-master
  namespace: unique
spec:
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis:v8.6.2
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 2Gi
  redisConfig:
    additionalRedisConfig: |
      maxmemory 1536mb
      maxmemory-policy allkeys-lru
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.84.0
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: gl4f-filesystem
