apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: unique
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: chat
      owner: unique
      secret:
        name: postgres-secret
      postInitSQL:
        - CREATE DATABASE "app-repository" OWNER "unique"
        - CREATE DATABASE "configuration-backend" OWNER "unique"
        - CREATE DATABASE ingestion OWNER "unique"
        - CREATE DATABASE litellm OWNER "unique"
        - CREATE DATABASE "scope-management" OWNER "unique"
        - CREATE DATABASE gatekeeper OWNER "unique"
        - CREATE DATABASE zitadel OWNER "unique"
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: postgres-postgresql
  postgresql:
    parameters:
      max_connections: "200"
  storage:
    size: 20Gi
    storageClass: gl4f-filesystem
  resources:
    limits:
      cpu: 2
      memory: 8Gi
    requests:
      cpu: 1
      memory: 4Gi
