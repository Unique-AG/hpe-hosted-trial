apiVersion: v1
kind: ServiceAccount
metadata:
  name: connection-secret-reader
  namespace: unique
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: connection-secret-reader
  namespace: unique
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: connection-secret-reader
  namespace: unique
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: connection-secret-reader
    namespace: unique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: connection-secret-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: in-cluster-secrets
  namespace: unique
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    kubernetes:
      remoteNamespace: unique
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: connection-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: configuration-backend-connections
  namespace: unique
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: in-cluster-secrets
  target:
    name: configuration-backend-connections
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: 'postgresql://{{ .databaseUsername | urlquery }}:{{ .databasePassword | urlquery }}@postgres-rw.unique.svc.cluster.local:5432/configuration-backend'
  data:
    - secretKey: databaseUsername
      remoteRef:
        key: postgres-secret
        property: username
    - secretKey: databasePassword
      remoteRef:
        key: postgres-secret
        property: password
---
