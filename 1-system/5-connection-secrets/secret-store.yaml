apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: in-cluster-secrets
  namespace: unique
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    kubernetes:
      remoteNamespace: unique
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: connection-secret-reader
