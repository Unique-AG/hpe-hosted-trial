apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: litellm-virtual-service
spec:
  gateways:
    - istio-system/ezaf-gateway
  hosts:
    # HPE: litellm.ingress.pcai0201.fr2.hpecolo.net
    - litellm.2.28.18.215.sslip.io
  http:
    - match:
        - uri:
            prefix: /
      rewrite:
        uri: /
      route:
        - destination:
            host: litellm.unique.svc.cluster.local
            port:
              number: 4000
