spec:
  name: assistants-agentic-table
  rolloutGroup: specialist
  autoSync: false
  destination:
    namespace: unique
  source:
    # HPE: oci://harbor.ingress.pcai0201.fr2.hpecolo.net/unique/helm/assistants-agentic-table
    repoURL: oci://harbor.unique.svc.cluster.local/library/helm/assistants-agentic-table
    targetRevision: sha256:ed6ddf1bc03be40d5b32f3cacb5af96dcb99cba6ebf45ba10defff20b95e1b52
    path: .
    helm:
      passCredentials: true
      releaseName: assistants-agentic-table
      valuesObject:
        global:
          image:
            # HPE: harbor.ingress.pcai0201.fr2.hpecolo.net
            registry: harbor.2.28.18.215.sslip.io
            pullSecrets:
              - name: harbor-pull-secret
        image:
          repository: library/images/assistants-agentic-table
          useDigest: false
        env:
          NODE_EXTRA_CA_CERTS: /etc/ssl/postgres/ca.crt
          UNIQUE_INSTALLATION_ID: hpe-hosted-trial
          # HPE: https://id.ingress.pcai0201.fr2.hpecolo.net
          ZITADEL_ISSUER: https://id.2.28.18.215.sslip.io
          ZITADEL_PROJECT_ID: "388831517784146088"
        # Helm replaces the chart's default lists when these are overridden.
        # Preserve the writable cache required by tiktoken and Prometheus.
        volumes:
          - name: tmp-volume
            emptyDir:
              sizeLimit: 5Gi
          - name: gunicorn-runtime
            emptyDir: {}
          - name: postgres-ca
            secret:
              secretName: postgres-ca
              items:
                - key: ca.crt
                  path: ca.crt
        volumeMounts:
          - name: tmp-volume
            mountPath: /tmp
          - name: gunicorn-runtime
            mountPath: /home/app/.gunicorn
          - name: postgres-ca
            mountPath: /etc/ssl/postgres/ca.crt
            subPath: ca.crt
            readOnly: true
        routes:
          gateway:
            name: unique
            namespace: unique
          # HPE: api.ingress.pcai0201.fr2.hpecolo.net
          hostname: api.2.28.18.215.sslip.io
        postgresql:
          connection:
            host: postgres-rw.unique.svc.cluster.local
            port: 5432
        redis:
          connection:
            host: redis-master.unique.svc.cluster.local
            port: 6379
        rabbitmq:
          connection:
            host: rabbitmq.unique.svc.cluster.local
        objectStorage:
          endpoint: http://rustfs-svc.unique.svc.cluster.local:9000
          region: us-east-1
        litellm:
          enabled: true
          connection:
            host: litellm.unique.svc.cluster.local
            port: 4000
        namespaceOverride: unique
