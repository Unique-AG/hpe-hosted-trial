spec:
  name: node-ingestion-worker
  rolloutGroup: worker
  autoSync: true
  destination:
    namespace: unique
  source:
    repoURL: oci://harbor.unique.svc.cluster.local/library/helm/ingestion-worker
    targetRevision: sha256:973b19e89e847b6b5f9e0f67fc2cf9cf0f8590dae06225b2a442f5c3b2b7ef6c
    path: .
    helm:
      passCredentials: true
      releaseName: ingestion-worker
      valuesObject:
        global:
          image:
            registry: harbor.localhost
            pullSecrets:
              - name: harbor-pull-secret
        image:
          repository: library/images/ingestion-worker
          useDigest: false
        keda:
          enabled: false
        env:
          NODE_EXTRA_CA_CERTS: /etc/ssl/postgres/ca.crt
          MAX_HEAP_MB: 3000
          NUMBER_OF_PDF_PAGES_IN_PARALLEL: 10
          UNIQUE_INSTALLATION_ID: __UNIQUE_INSTALLATION_ID__
          ZITADEL_ISSUER: http://id.localhost
          ZITADEL_PROJECT_ID: "__ZITADEL_PROJECT_ID__"
          S3_BUCKET_ENDPOINT: http://rustfs-svc.unique.svc.cluster.local:9000
          S3_BUCKET_NAME: unique-ingestion-bucket
          S3_BUCKET_REGION: us-east-1
        volumes:
          - name: postgres-ca
            secret:
              secretName: postgres-ca
              items:
                - key: ca.crt
                  path: ca.crt
        volumeMounts:
          - name: postgres-ca
            mountPath: /etc/ssl/postgres/ca.crt
            subPath: ca.crt
            readOnly: true
        routes:
          gateway:
            name: unique
            namespace: unique
          hostname: api.localhost
        internalServices:
          dependencies:
            chat:
              namespace: unique
            ingestion:
              namespace: unique
        postgresql:
          connection:
            host: postgres-rw.unique.svc.cluster.local
            port: 5432
        redis:
          connection:
            host: redis-master.unique.svc.cluster.local
            port: 6379
        rabbitmq:
          connection:
            host:
              fromKubernetesService:
                name: rabbitmq
                namespace: unique
                podPort: 5672
            url:
              fromSecret:
                name: node-ingestion-worker-connections
                key: AMQP_URL
        objectStorage:
          endpoint: http://rustfs-svc.unique.svc.cluster.local:9000
          region: us-east-1
        litellm:
          enabled: true
          connection:
            host: litellm.unique.svc.cluster.local
            port: 4000
