spec:
  name: node-ingestion
  rolloutGroup: core
  autoSync: true
  destination:
    namespace: unique
  source:
    # HPE: oci://harbor.ingress.pcai0201.fr2.hpecolo.net/unique/helm/ingestion
    repoURL: oci://harbor.unique.svc.cluster.local/library/helm/ingestion
    targetRevision: sha256:7392ecb2c290640d8c1b9219940afa52cdaf5fd272508b29b703d8f3d2f33fa8
    path: .
    helm:
      passCredentials: true
      releaseName: node-ingestion
      valuesObject:
        global:
          image:
            # HPE: harbor.ingress.pcai0201.fr2.hpecolo.net
            registry: harbor.2.28.18.215.sslip.io
            pullSecrets:
              - name: harbor-pull-secret
        image:
          repository: library/images/ingestion
          useDigest: false
        env:
          NODE_EXTRA_CA_CERTS: /etc/ssl/postgres/ca.crt
          AZURE_OPENAI_API_VERSION: 2023-03-15-preview
          FILE_RETENTION_IN_DAYS: 30
          # HPE: https://api.ingress.pcai0201.fr2.hpecolo.net/scoped/ingestion/upload
          INGESTION_UPLOAD_API_URL: https://api.2.28.18.215.sslip.io/scoped/ingestion/upload
          MAX_HEAP_MB: 950
          UNIQUE_INSTALLATION_ID: hpe-hosted-trial
          # HPE: https://id.ingress.pcai0201.fr2.hpecolo.net
          ZITADEL_ISSUER: https://id.2.28.18.215.sslip.io
          ZITADEL_PROJECT_ID: __ZITADEL_PROJECT_ID__
          S3_BUCKET_ENDPOINT: http://rustfs-svc.unique.svc.cluster.local:9000
          S3_BUCKET_NAME: unique-ingestion-bucket
          S3_BUCKET_REGION: us-east-1
        volumes:
          - name: postgres-ca
            secret:
              secretName: postgres-ca
              items:
                - key: ca.crt
                  path: ca.crt
        volumeMounts:
          - name: postgres-ca
            mountPath: /etc/ssl/postgres/ca.crt
            subPath: ca.crt
            readOnly: true
        routes:
          gateway:
            name: unique
            namespace: unique
          # HPE: api.ingress.pcai0201.fr2.hpecolo.net
          hostname: api.2.28.18.215.sslip.io
        internalServices:
          dependencies:
            scopeManagement:
              name: node-scope-management
              namespace: unique
        elasticsearch:
          connection:
            host:
              fromKubernetesService:
                name: elasticsearch-ingestion-es-http
                namespace: unique
                podPort: 9200
                skipClusterDomain: true
            password:
              fromSecret:
                name: elasticsearch-ingestion-es-elastic-user
                key: elastic
            caBundle:
              fromSecret:
                name: elasticsearch-ingestion-es-http-certs-public
                key: ca.crt
              mountPath: /etc/ssl/elastic/ca.crt
        qdrant:
          readConsistency: 1
          connection:
            host:
              fromKubernetesService:
                name: qdrant-headless
                namespace: unique
                podPort: 6333
            port: 6333
        postgresql:
          connection:
            host: postgres-rw.unique.svc.cluster.local
            port: 5432
            url:
              fromSecret:
                name: node-ingestion-connections
                key: DATABASE_URL
        redis:
          connection:
            host: redis-master.unique.svc.cluster.local
            port: 6379
        rabbitmq:
          connection:
            host: rabbitmq.unique.svc.cluster.local
            url:
              fromSecret:
                name: node-ingestion-connections
                key: AMQP_URL
        objectStorage:
          endpoint: http://rustfs-svc.unique.svc.cluster.local:9000
          region: us-east-1
        litellm:
          enabled: true
          connection:
            host: litellm.unique.svc.cluster.local
            port: 4000
        nameOverride: node-ingestion
        fullnameOverride: node-ingestion
        extraEnvSecrets:
          - node-ingestion-connections
          - node-ingestion-secrets
