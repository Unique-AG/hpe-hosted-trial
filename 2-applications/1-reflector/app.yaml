spec:
  name: reflector
  rolloutGroup: core
  autoSync: true
  destination:
    namespace: unique
  source:
    repoURL: oci://harbor.unique.svc.cluster.local/library/helm/reflector
    targetRevision: sha256:e9e31175b05b3aedaf9895ac8e68efe9bda8816ee6140c8fa7987de27677fb13
    path: .
    helm:
      passCredentials: true
      releaseName: reflector
      valuesObject:
        global:
          image:
            registry: harbor.localhost
            pullSecrets:
              - name: harbor-pull-secret
        image:
          repository: library/images/reflector
          useDigest: false
        env:
          NODE_EXTRA_CA_CERTS: /etc/ssl/postgres/ca.crt
          UNIQUE_INSTALLATION_ID: __UNIQUE_INSTALLATION_ID__
          ZITADEL_ISSUER: http://id.localhost
          ZITADEL_PROJECT_ID: "__ZITADEL_PROJECT_ID__"
        volumes:
          - name: postgres-ca
            secret:
              secretName: postgres-ca
              items:
                - key: ca.crt
                  path: ca.crt
        volumeMounts:
          - name: postgres-ca
            mountPath: /etc/ssl/postgres/ca.crt
            subPath: ca.crt
            readOnly: true
        routes:
          gateway:
            name: unique
            namespace: unique
          hostname: api.localhost
        postgresql:
          connection:
            host: postgres-rw.unique.svc.cluster.local
            port: 5432
        redis:
          connection:
            host: redis-master.unique.svc.cluster.local
            port: 6379
        rabbitmq:
          connection:
            host: rabbitmq.unique.svc.cluster.local
        objectStorage:
          endpoint: http://rustfs-svc.unique.svc.cluster.local:9000
          region: us-east-1
        litellm:
          enabled: true
          connection:
            host: litellm.unique.svc.cluster.local
            port: 4000
        namespaceOverride: unique
