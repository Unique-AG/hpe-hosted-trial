spec:
  name: sbx-gateway
  rolloutGroup: specialist
  autoSync: false
  destination:
    namespace: unique
  source:
    # HPE: oci://harbor.ingress.pcai0201.fr2.hpecolo.net/unique/helm/sbx-gateway
    repoURL: oci://harbor.unique.svc.cluster.local/library/helm/sbx-gateway
    targetRevision: sha256:d8a5423303b7d48ff012c8ed235b768468a10499735fe5837b8d1499075cf9da
    path: .
    helm:
      passCredentials: true
      releaseName: sbx-gateway
      valuesObject:
        global:
          image:
            # HPE: harbor.ingress.pcai0201.fr2.hpecolo.net
            registry: harbor.2.28.18.215.sslip.io
            pullSecrets:
              - name: harbor-pull-secret
        image:
          repository: library/images/sbx-gateway
          useDigest: false
        autoscaling:
          enabled: false
        env:
          NODE_EXTRA_CA_CERTS: /etc/ssl/postgres/ca.crt
          UNIQUE_INSTALLATION_ID: hpe-hosted-trial
          # HPE: https://id.ingress.pcai0201.fr2.hpecolo.net
          ZITADEL_ISSUER: https://id.2.28.18.215.sslip.io
          ZITADEL_PROJECT_ID: "388734592988807375"
        volumes:
          - name: postgres-ca
            secret:
              secretName: postgres-ca
              items:
                - key: ca.crt
                  path: ca.crt
        volumeMounts:
          - name: postgres-ca
            mountPath: /etc/ssl/postgres/ca.crt
            subPath: ca.crt
            readOnly: true
        routes:
          gateway:
            name: unique
            namespace: unique
          # HPE: api.ingress.pcai0201.fr2.hpecolo.net
          hostname: api.2.28.18.215.sslip.io
        postgresql:
          connection:
            host: postgres-rw.unique.svc.cluster.local
            port: 5432
        redis:
          connection:
            host: redis-master.unique.svc.cluster.local
            port: 6379
        rabbitmq:
          connection:
            host: rabbitmq.unique.svc.cluster.local
        objectStorage:
          endpoint: http://rustfs-svc.unique.svc.cluster.local:9000
          region: us-east-1
        litellm:
          enabled: true
          connection:
            host: litellm.unique.svc.cluster.local
            port: 4000
        egressGateway:
          allowHostsConfig: |
            chat.unique.svc.cluster.local: true
            ingestion.unique.svc.cluster.local: true
            # HPE: api.ingress.pcai0201.fr2.hpecolo.net: true
            api.2.28.18.215.sslip.io: true
            rustfs-svc.unique.svc.cluster.local: true
            sbx-storage.unique.svc.cluster.local: true
            pypi.org: true
            files.pythonhosted.org: true
          allowPathsConfig: |
            chat.unique.svc.cluster.local:
              - /public/*
            ingestion.unique.svc.cluster.local:
              - /scoped/upload
            # HPE: api.ingress.pcai0201.fr2.hpecolo.net:
            api.2.28.18.215.sslip.io:
              - /scoped/ingestion/upload
            rustfs-svc.unique.svc.cluster.local:
              - /unique-ingestion-bucket/*
            sbx-storage.unique.svc.cluster.local:
              - /v1/checkpoint
              - /v1/skill-cache-base
            pypi.org:
              - /simple*
            files.pythonhosted.org:
              - /packages/*
          allowMethodsConfig: |
            ingestion.unique.svc.cluster.local:
              - PUT
            # HPE: api.ingress.pcai0201.fr2.hpecolo.net:
            api.2.28.18.215.sslip.io:
              - PUT
            rustfs-svc.unique.svc.cluster.local:
              - GET
              - HEAD
              - PUT
            sbx-storage.unique.svc.cluster.local:
              - GET
              - HEAD
              - PUT
            pypi.org:
              - GET
              - HEAD
            files.pythonhosted.org:
              - GET
              - HEAD
