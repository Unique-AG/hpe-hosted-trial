spec:
  name: node-chat
  rolloutGroup: core
  autoSync: true
  destination:
    namespace: unique
  source:
    # HPE: oci://harbor.ingress.pcai0201.fr2.hpecolo.net/unique/helm/chat
    repoURL: oci://harbor.unique.svc.cluster.local/library/helm/chat
    targetRevision: sha256:54bfb97ef6de9dd4206c44955c8c6129fd9ded1b3bf7a598eeff93f51a204108
    path: .
    helm:
      passCredentials: true
      releaseName: node-chat
      valuesObject:
        global:
          image:
            # HPE: harbor.ingress.pcai0201.fr2.hpecolo.net
            registry: harbor.localhost
            pullSecrets:
              - name: harbor-pull-secret
        image:
          repository: library/images/node-chat
        env:
          UNIQUE_INSTALLATION_ID: hpe-hosted-trial
          # HPE: https://id.ingress.pcai0201.fr2.hpecolo.net
          ZITADEL_ISSUER: http://id.localhost
          ZITADEL_PROJECT_ID: hpe-hosted-trial
          # HPE: https://unique.ingress.pcai0201.fr2.hpecolo.net/admin
          ADMIN_FRONTEND_URL: http://unique.localhost/admin
          # HPE: https://unique.ingress.pcai0201.fr2.hpecolo.net/chat
          CHAT_FRONTEND_URL: http://unique.localhost/chat
          ENABLE_EXTERNAL_ASSISTANT: "true"
          GATEKEEPER_RUNNING_MODE: enforce
          # HPE: https://api.ingress.pcai0201.fr2.hpecolo.net
          MCP_HUB_BASE_URL: http://api.localhost
          OPENAI_PROVIDER: litellm
          S3_BUCKET_ENDPOINT: http://rustfs-svc.unique.svc.cluster.local:9000
          S3_BUCKET_NAME: unique-ingestion-bucket
          S3_BUCKET_REGION: us-east-1
        routes:
          gateway:
            name: unique
            namespace: unique
          # HPE: api.ingress.pcai0201.fr2.hpecolo.net
          hostname: api.localhost
        internalServices:
          namespace: unique
          dependencies:
            appRepository:
              name: node-app-repository
              namespace: unique
            assistantsCore:
              name: assistants-core
              namespace: unique
            gatekeeper:
              enabled: true
              name: gatekeeper
              namespace: unique
            ingestion:
              name: node-ingestion
              namespace: unique
            sbxGateway:
              name: sbx-gateway
              namespace: unique
            scopeManagement:
              name: node-scope-management
              namespace: unique
          dependents:
            agenticIngestion:
              name: agentic-ingestion
              namespace: unique
            assistantsCore:
              name: assistants-core
              namespace: unique
            ingestionWorker:
              name: node-ingestion-worker
              namespace: unique
        postgresql:
          connection:
            host: postgres-rw.unique.svc.cluster.local
            port: 5432
            url:
              fromSecret:
                name: node-chat-connections
                key: DATABASE_URL
        redis:
          connection:
            host: redis-master.unique.svc.cluster.local
            port: 6379
            db: 2
        rabbitmq:
          connection:
            host:
              fromKubernetesService:
                name: rabbitmq
                namespace: unique
                podPort: 5672
            url:
              fromSecret:
                name: node-chat-connections
                key: AMQP_URL
        objectStorage:
          endpoint: http://rustfs-svc.unique.svc.cluster.local:9000
          region: us-east-1
        litellm:
          enabled: true
          connection:
            host:
              fromKubernetesService:
                name: litellm
                namespace: unique
                podPort: 4000
            port: 4000
            apiKey:
              fromSecret:
                name: node-chat-connections
                key: LITELLM_MASTER_KEY
        nameOverride: node-chat
        fullnameOverride: node-chat
        extraEnvSecrets:
          - node-chat-connections
          - node-chat-secrets
