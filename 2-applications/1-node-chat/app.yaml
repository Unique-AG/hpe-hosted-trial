spec:
  name: node-chat
  rolloutGroup: core
  autoSync: true
  destination:
    namespace: unique
  source:
    # HPE: oci://harbor.ingress.pcai0201.fr2.hpecolo.net/unique/helm/chat
    repoURL: oci://harbor.unique.svc.cluster.local/library/helm/chat
    targetRevision: sha256:54bfb97ef6de9dd4206c44955c8c6129fd9ded1b3bf7a598eeff93f51a204108
    path: .
    helm:
      passCredentials: true
      releaseName: chat
      valuesObject:
        global:
          image:
            # HPE: harbor.ingress.pcai0201.fr2.hpecolo.net
            registry: harbor.2.28.18.215.sslip.io
            pullSecrets:
              - name: harbor-pull-secret
        image:
          repository: library/images/node-chat
          useDigest: false
        autoscaling:
          enabled: false
        env:
          NODE_EXTRA_CA_CERTS: /etc/ssl/postgres/ca.crt
          UNIQUE_INSTALLATION_ID: hpe-hosted-trial
          # HPE: https://id.ingress.pcai0201.fr2.hpecolo.net
          ZITADEL_ISSUER: https://id.2.28.18.215.sslip.io
          ZITADEL_PROJECT_ID: "388746568834023667"
          # HPE: https://unique.ingress.pcai0201.fr2.hpecolo.net/admin
          ADMIN_FRONTEND_URL: https://unique.2.28.18.215.sslip.io/admin
          # HPE: https://unique.ingress.pcai0201.fr2.hpecolo.net/chat
          CHAT_FRONTEND_URL: https://unique.2.28.18.215.sslip.io/chat
          ENABLE_EXTERNAL_ASSISTANT: "true"
          FEATURE_FLAG_USE_OPENAI_V1_13819: "true"
          GATEKEEPER_RUNNING_MODE: enforce
          MAX_HEAP_MB: 1400
          # HPE: https://api.ingress.pcai0201.fr2.hpecolo.net
          MCP_HUB_BASE_URL: https://api.2.28.18.215.sslip.io
          OPENAI_PROVIDER: litellm
          S3_BUCKET_ENDPOINT: http://rustfs-svc.unique.svc.cluster.local:9000
          S3_BUCKET_NAME: unique-ingestion-bucket
          S3_BUCKET_REGION: us-east-1
        volumes:
          - name: postgres-ca
            secret:
              secretName: postgres-ca
              items:
                - key: ca.crt
                  path: ca.crt
        volumeMounts:
          - name: postgres-ca
            mountPath: /etc/ssl/postgres/ca.crt
            subPath: ca.crt
            readOnly: true
        routes:
          gateway:
            name: unique
            namespace: unique
          # HPE: api.ingress.pcai0201.fr2.hpecolo.net
          hostname: api.2.28.18.215.sslip.io
        internalServices:
          dependencies:
            appRepository:
              namespace: unique
            assistantsCore:
              namespace: unique
            gatekeeper:
              enabled: true
              namespace: unique
            ingestion:
              namespace: unique
            sbxGateway:
              namespace: unique
            scopeManagement:
              namespace: unique
          dependents:
            agenticIngestion:
              namespace: unique
            assistantsCore:
              namespace: unique
            ingestionWorker:
              namespace: unique
        postgresql:
          connection:
            host: postgres-rw.unique.svc.cluster.local
            port: 5432
            url:
              fromSecret:
                name: node-chat-connections
                key: DATABASE_URL
        redis:
          connection:
            host: redis-master.unique.svc.cluster.local
            port: 6379
            db: 2
        rabbitmq:
          connection:
            host:
              fromKubernetesService:
                name: rabbitmq
                namespace: unique
                podPort: 5672
            url:
              fromSecret:
                name: node-chat-connections
                key: AMQP_URL
        objectStorage:
          endpoint: http://rustfs-svc.unique.svc.cluster.local:9000
          region: us-east-1
        litellm:
          enabled: true
          connection:
            host:
              fromKubernetesService:
                name: litellm
                namespace: unique
                podPort: 4000
            port: 4000
            apiKey:
              fromSecret:
                name: node-chat-connections
                key: LITELLM_MASTER_KEY
        extraEnvSecrets:
          - node-chat-connections
          - node-chat-secrets
