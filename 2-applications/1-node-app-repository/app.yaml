spec:
  name: node-app-repository
  rolloutGroup: core
  autoSync: true
  destination:
    namespace: unique
  source:
    repoURL: oci://harbor.unique.svc.cluster.local/library/helm/app-repository
    targetRevision: sha256:16551dc19bb3b2f5da90d2259d161f28838859773b2cd7f2f92e7ec3a40c5b25
    path: .
    helm:
      passCredentials: true
      releaseName: app-repository
      valuesObject:
        global:
          image:
            registry: harbor.localhost
            pullSecrets:
              - name: harbor-pull-secret
        image:
          repository: library/images/app-repository
          useDigest: false
        env:
          NODE_EXTRA_CA_CERTS: /etc/ssl/postgres/ca.crt
          UNIQUE_INSTALLATION_ID: __UNIQUE_INSTALLATION_ID__
          ZITADEL_ISSUER: http://id.localhost
          ZITADEL_PROJECT_ID: "__ZITADEL_PROJECT_ID__"
        volumes:
          - name: postgres-ca
            secret:
              secretName: postgres-ca
              items:
                - key: ca.crt
                  path: ca.crt
        volumeMounts:
          - name: postgres-ca
            mountPath: /etc/ssl/postgres/ca.crt
            subPath: ca.crt
            readOnly: true
        routes:
          gateway:
            name: unique
            namespace: unique
          hostname: api.localhost
        postgresql:
          connection:
            host: postgres-rw.unique.svc.cluster.local
            port: 5432
            url:
              fromSecret:
                name: node-app-repository-connections
                key: DATABASE_URL
        redis:
          connection:
            host: redis-master.unique.svc.cluster.local
            port: 6379
        rabbitmq:
          connection:
            host: rabbitmq.unique.svc.cluster.local
            url:
              fromSecret:
                name: node-app-repository-connections
                key: AMQP_URL
        objectStorage:
          endpoint: http://rustfs-svc.unique.svc.cluster.local:9000
          region: us-east-1
        litellm:
          enabled: true
          connection:
            host: litellm.unique.svc.cluster.local
            port: 4000
        extraEnvSecrets:
          - node-app-repository-secrets
