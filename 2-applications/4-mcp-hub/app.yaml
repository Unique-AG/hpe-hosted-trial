spec:
  name: mcp-hub
  rolloutGroup: specialist
  autoSync: false
  destination:
    namespace: unique
  source:
    repoURL: oci://harbor.unique.svc.cluster.local/library/helm/mcp-hub
    targetRevision: sha256:6a2db0a140cc4975b70238e22a54a9a6a7f66d2fd0fb9cf16d21de5e0e9dac3e
    path: .
    helm:
      passCredentials: true
      releaseName: mcp-hub
      valuesObject:
        global:
          image:
            registry: harbor.localhost
            pullSecrets:
              - name: harbor-pull-secret
        image:
          repository: library/images/mcp-hub
          useDigest: false
        # The standalone hub must use the same credential-encryption key as
        # node-chat so both services can read existing MCP credentials.
        extraEnvSecrets:
          - node-chat-secrets
        workloadIdentity:
          azure:
            enabled: false
        env:
          NODE_EXTRA_CA_CERTS: /etc/ssl/postgres/ca.crt
          NEXT_APP_URL: http://unique.localhost
          UNIQUE_INSTALLATION_ID: __UNIQUE_INSTALLATION_ID__
          ZITADEL_ISSUER: http://id.localhost
          ZITADEL_PROJECT_ID: "__ZITADEL_PROJECT_ID__"
        volumes:
          - name: postgres-ca
            secret:
              secretName: postgres-ca
              items:
                - key: ca.crt
                  path: ca.crt
        volumeMounts:
          - name: postgres-ca
            mountPath: /etc/ssl/postgres/ca.crt
            subPath: ca.crt
            readOnly: true
        routes:
          gateway:
            name: unique
            namespace: unique
          hostname: api.localhost
        # The chart's well-known route has its own parentRefs and does not
        # inherit routes.gateway.
        extraRoutes:
          well-known:
            parentRefs:
              - name: unique
                namespace: unique
                group: gateway.networking.k8s.io
                kind: Gateway
        postgresql:
          connection:
            host: postgres-rw.unique.svc.cluster.local
            port: 5432
            database: chat
            username:
              fromSecret:
                name: postgres-secret
                key: username
            password:
              fromSecret:
                name: postgres-secret
                key: password
            sslMode: disable
        redis:
          connection:
            host: redis-master.unique.svc.cluster.local
            port: 6379
        rabbitmq:
          connection:
            host: rabbitmq.unique.svc.cluster.local
            username:
              fromSecret:
                name: rabbitmq-password-secret
                key: username
            password:
              fromSecret:
                name: rabbitmq-password-secret
                key: password
        objectStorage:
          endpoint: http://rustfs-svc.unique.svc.cluster.local:9000
          region: us-east-1
        litellm:
          enabled: true
          connection:
            host: litellm.unique.svc.cluster.local
            port: 4000
        namespaceOverride: unique
