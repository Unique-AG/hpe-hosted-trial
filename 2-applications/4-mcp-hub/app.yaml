spec:
  name: mcp-hub
  rolloutGroup: specialist
  autoSync: false
  destination:
    namespace: unique
  source:
    # HPE: oci://harbor.ingress.pcai0201.fr2.hpecolo.net/unique/helm/mcp-hub
    repoURL: oci://harbor.unique.svc.cluster.local/library/helm/mcp-hub
    targetRevision: sha256:6a2db0a140cc4975b70238e22a54a9a6a7f66d2fd0fb9cf16d21de5e0e9dac3e
    path: .
    helm:
      passCredentials: true
      releaseName: mcp-hub
      valuesObject:
        global:
          image:
            # HPE: harbor.ingress.pcai0201.fr2.hpecolo.net
            registry: harbor.localhost
            pullSecrets:
              - name: harbor-pull-secret
        image:
          repository: library/images/mcp-hub
        env:
          # HPE: https://unique.ingress.pcai0201.fr2.hpecolo.net
          NEXT_APP_URL: http://unique.localhost
          UNIQUE_INSTALLATION_ID: hpe-hosted-trial
          # HPE: https://id.ingress.pcai0201.fr2.hpecolo.net
          ZITADEL_ISSUER: http://id.localhost
          ZITADEL_PROJECT_ID: hpe-hosted-trial
        routes:
          gateway:
            name: unique
            namespace: unique
          # HPE: api.ingress.pcai0201.fr2.hpecolo.net
          hostname: api.localhost
        postgresql:
          connection:
            host: postgres-rw.unique.svc.cluster.local
            port: 5432
            database: chat
            username:
              fromSecret:
                name: postgres-secret
                key: username
            password:
              fromSecret:
                name: postgres-secret
                key: password
            sslMode: disable
        redis:
          connection:
            host: redis-master.unique.svc.cluster.local
            port: 6379
        rabbitmq:
          connection:
            host: rabbitmq.unique.svc.cluster.local
            username:
              fromSecret:
                name: rabbitmq-password-secret
                key: username
            password:
              fromSecret:
                name: rabbitmq-password-secret
                key: password
        objectStorage:
          endpoint: http://rustfs-svc.unique.svc.cluster.local:9000
          region: us-east-1
        litellm:
          enabled: true
          connection:
            host: litellm.unique.svc.cluster.local
            port: 4000
        namespaceOverride: unique
