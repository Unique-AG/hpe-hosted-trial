apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: unique-jwt-auth
  annotations:
    kubernetes.io/ingress.class: kong
plugin: unique-jwt-auth
config:
  uri_param_names:
    - "token"
  allowed_iss:
    # HPE: "https://id.ingress.pcai0201.fr2.hpecolo.net"
    - "http://id.localhost"
  algorithm: RS256
  # HPE: "https://id.ingress.pcai0201.fr2.hpecolo.net/.well-known/openid-configuration"
  well_known_template: "http://id.localhost/.well-known/openid-configuration"
  zitadel_project_id: "319135515339170598"