spec:
  name: admin-app
  rolloutGroup: frontend
  autoSync: true
  destination:
    namespace: unique
  source:
    repoURL: oci://harbor.unique.svc.cluster.local/library/helm/admin-app
    targetRevision: sha256:619419d4f1e130b7522627d4ea393ebc520c4371175786729fb0520f9950a487
    path: .
    helm:
      passCredentials: true
      releaseName: admin-app
      valuesObject:
        global:
          image:
            registry: harbor.localhost
            pullSecrets:
              - name: harbor-pull-secret
        image:
          repository: library/images/admin
          useDigest: false
        env:
          NODE_EXTRA_CA_CERTS: /etc/ssl/postgres/ca.crt
          CONTENT_SECURITY_POLICY_VALUE: >-
            default-src 'self'; img-src https: blob: data:; script-src 'self' 'unsafe-inline' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' blob: http://api.localhost http://id.localhost wss://api.localhost *.unique.app wss://*.stt.speech.microsoft.com wss://*.unique.app; media-src 'self' blob: http://api.localhost https://*.unique.app; frame-ancestors 'self' http://localhost:*; frame-src 'self'; worker-src 'self' blob: data:;
          UNIQUE_INSTALLATION_ID: __UNIQUE_INSTALLATION_ID__
          ZITADEL_ISSUER: http://id.localhost
          ZITADEL_PROJECT_ID: "__ZITADEL_PROJECT_ID__"
          ADMIN_APP_URL: http://unique.localhost/admin
          APP_REPOSITORY_BACKEND_API_URL: http://api.localhost/apps
          CHAT_APP_URL: http://unique.localhost/chat
          CHAT_BACKEND_API_URL: http://api.localhost/chat
          INGESTION_BACKEND_API_URL: http://api.localhost/ingestion
          KNOWLEDGE_UPLOAD_APP_URL: http://unique.localhost/knowledge-upload
          SCOPE_MANAGEMENT_BACKEND_API_URL: http://api.localhost/scope-management
          STATIC_TAB_NAME: Unique HPE
          THEME_BACKEND_API_URL: http://api.localhost/configuration
          ZITADEL_CLIENT_ID: "__ZITADEL_CLIENT_ID__"
        volumes:
          - name: postgres-ca
            secret:
              secretName: postgres-ca
              items:
                - key: ca.crt
                  path: ca.crt
        volumeMounts:
          - name: postgres-ca
            mountPath: /etc/ssl/postgres/ca.crt
            subPath: ca.crt
            readOnly: true
        routes:
          gateway:
            name: unique
            namespace: unique
          hostname: unique.localhost
        postgresql:
          connection:
            host: postgres-rw.unique.svc.cluster.local
            port: 5432
        redis:
          connection:
            host: redis-master.unique.svc.cluster.local
            port: 6379
        rabbitmq:
          connection:
            host: rabbitmq.unique.svc.cluster.local
        objectStorage:
          endpoint: http://rustfs-svc.unique.svc.cluster.local:9000
          region: us-east-1
        litellm:
          enabled: true
          connection:
            host: litellm.unique.svc.cluster.local
            port: 4000
        namespaceOverride: unique
