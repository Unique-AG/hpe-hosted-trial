spec:
  name: configuration-backend
  rolloutGroup: core
  autoSync: true
  destination:
    namespace: unique
  source:
    # HPE: oci://harbor.ingress.pcai0201.fr2.hpecolo.net/unique/helm/configuration
    repoURL: oci://harbor.unique.svc.cluster.local/library/helm/configuration
    targetRevision: sha256:bbf92a66c394f363400ed9549006d59e1cecb1f25510db823d52888562837306
    path: .
    helm:
      passCredentials: true
      releaseName: configuration-backend
      valuesObject:
        global:
          image:
            # HPE: harbor.ingress.pcai0201.fr2.hpecolo.net
            registry: harbor.2.28.18.215.sslip.io
            pullSecrets:
              - name: harbor-pull-secret
        image:
          repository: library/images/configuration-backend
          useDigest: false
        autoscaling:
          enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 600Mi
          limits:
            cpu: 100m
            memory: 700Mi
        env:
          NODE_EXTRA_CA_CERTS: /etc/ssl/postgres/ca.crt
          MAX_HEAP_MB: "560"
          UNIQUE_INSTALLATION_ID: hpe-hosted-trial
          # HPE: https://id.ingress.pcai0201.fr2.hpecolo.net
          ZITADEL_ISSUER: https://id.2.28.18.215.sslip.io
          ZITADEL_PROJECT_ID: "388746568834023667"
        volumes:
          - name: postgres-ca
            secret:
              secretName: postgres-ca
              items:
                - key: ca.crt
                  path: ca.crt
        volumeMounts:
          - name: postgres-ca
            mountPath: /etc/ssl/postgres/ca.crt
            subPath: ca.crt
            readOnly: true
        routes:
          gateway:
            name: unique
            namespace: unique
          # HPE: api.ingress.pcai0201.fr2.hpecolo.net
          hostname: api.2.28.18.215.sslip.io
        postgresql:
          connection:
            host: postgres-rw.unique.svc.cluster.local
            port: 5432
            url:
              fromSecret:
                name: configuration-backend-connections
                key: DATABASE_URL
        redis:
          connection:
            host: redis-master.unique.svc.cluster.local
            port: 6379
        rabbitmq:
          connection:
            host: rabbitmq.unique.svc.cluster.local
        objectStorage:
          endpoint: http://rustfs-svc.unique.svc.cluster.local:9000
          region: us-east-1
        litellm:
          enabled: true
          connection:
            host: litellm.unique.svc.cluster.local
            port: 4000
        internalServices:
          dependencies:
            gatekeeper:
              enabled: true
        namespaceOverride: unique
