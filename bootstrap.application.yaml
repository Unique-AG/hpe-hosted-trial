# Apply this bootstrap manifest with kubectl apply -f bootstrap.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-bootstrap
  namespace: unique
spec:
  project: default
  sources:
    # The system dependencies like kong, databases, redis, etc.
    # Managed by the 1-system ApplicationSet rollout steps.
    - repoURL: https://github.com/Unique-AG/hpe-hosted-trial
      targetRevision: feat/upgrade-to-2026
      path: 1-system
  destination:
    server: https://kubernetes.default.svc
    namespace: unique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true