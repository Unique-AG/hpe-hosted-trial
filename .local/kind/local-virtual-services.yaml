apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: local-unique
  namespace: unique
spec:
  gateways:
    - istio-system/ezaf-gateway
  hosts:
    - unique.localhost
  http:
    - rewrite:
        authority: unique.ingress.pcai0201.fr2.hpecolo.net
      route:
        - destination:
            host: kong-gateway-proxy.unique.svc.cluster.local
            port:
              number: 80
---
