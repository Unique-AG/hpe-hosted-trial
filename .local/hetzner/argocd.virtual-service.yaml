apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cloud-argocd
  namespace: unique
spec:
  gateways:
    - istio-system/ezaf-gateway
  hosts:
    - argocd.__BASE_DOMAIN__
  http:
    - route:
        - destination:
            host: argocd-server.unique.svc.cluster.local
            port:
              number: 80
